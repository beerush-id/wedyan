<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Motions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#b43f5c"/>
      <stop offset="1" stop-color="#4b1528"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="14%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#1c0f17"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b38a"/>
      <stop offset="0.6" stop-color="#f08a63"/>
      <stop offset="1" stop-color="#c8553d"/>
    </linearGradient>
    <linearGradient id="frameBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fe1cb"/>
      <stop offset="1" stop-color="#2f9c8c"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe2c4"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd2ac" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd2ac" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#2a0814" flood-opacity="0.55"/>
    </filter>
    <filter id="lift" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.3" flood-color="#2a0814" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <g transform="rotate(-7 50 52)">
      <rect x="14" y="32" width="72" height="38" rx="4" fill="url(#film)"/>
      <g fill="#fff7ef" fill-opacity="0.85">
        <rect x="18" y="35" width="4" height="3" rx="0.8"/>
        <rect x="26" y="35" width="4" height="3" rx="0.8"/>
        <rect x="34" y="35" width="4" height="3" rx="0.8"/>
        <rect x="42" y="35" width="4" height="3" rx="0.8"/>
        <rect x="50" y="35" width="4" height="3" rx="0.8"/>
        <rect x="58" y="35" width="4" height="3" rx="0.8"/>
        <rect x="66" y="35" width="4" height="3" rx="0.8"/>
        <rect x="74" y="35" width="4" height="3" rx="0.8"/>
        <rect x="18" y="64" width="4" height="3" rx="0.8"/>
        <rect x="26" y="64" width="4" height="3" rx="0.8"/>
        <rect x="34" y="64" width="4" height="3" rx="0.8"/>
        <rect x="42" y="64" width="4" height="3" rx="0.8"/>
        <rect x="50" y="64" width="4" height="3" rx="0.8"/>
        <rect x="58" y="64" width="4" height="3" rx="0.8"/>
        <rect x="66" y="64" width="4" height="3" rx="0.8"/>
        <rect x="74" y="64" width="4" height="3" rx="0.8"/>
      </g>
      <rect x="17" y="41" width="20" height="20" rx="1.8" fill="url(#frameBack)" opacity="0.75"/>
      <rect x="63" y="41" width="20" height="20" rx="1.8" fill="url(#frameBack)" opacity="0.75"/>
      <g filter="url(#lift)">
        <rect x="39" y="40" width="22" height="22" rx="2" fill="url(#frame)"/>
      </g>
    </g>

    <path d="M20 26h18" stroke="url(#streak)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M14 21h13" stroke="url(#streak)" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

    <path d="M45.5 43.5q0-2.8 2.4-1.4l11.6 6.7q2.4 1.4 0 2.8l-11.6 6.7q-2.4 1.4-2.4-1.4Z" fill="url(#play)"/>

    <g transform="translate(78 24)">
      <path d="M0-8 2.2-2.2 8 0 2.2 2.2 0 8-2.2 2.2-8 0-2.2-2.2Z" fill="#fff7ef"/>
    </g>
  </g>
</svg>
