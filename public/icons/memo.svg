<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Memo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#d79a3c"/>
      <stop offset="1" stop-color="#8a4f17"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="14%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f1e6d6"/>
    </linearGradient>
    <linearGradient id="cardBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2bf"/>
      <stop offset="1" stop-color="#e2c494"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f08a63"/>
      <stop offset="1" stop-color="#c8553d"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#3a1e05" flood-opacity="0.5"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#3a1e05" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <g transform="rotate(-8 46 50)" filter="url(#lift)">
      <rect x="22" y="22" width="48" height="56" rx="3.5" fill="url(#cardBack)"/>
    </g>

    <g transform="rotate(5 52 52)">
      <rect x="28" y="25" width="48" height="56" rx="3.5" fill="url(#card)"/>
      <path d="M36 41h28" stroke="#8a4f17" stroke-width="3" stroke-linecap="round"/>
      <path d="M36 51h32M36 59h32M36 67h20" stroke="#cdb391" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <g transform="translate(66 26) rotate(28)">
      <circle cx="0" cy="0" r="6.5" fill="url(#pin)"/>
      <circle cx="-2" cy="-2" r="2" fill="#ffffff" fill-opacity="0.45"/>
      <path d="M0 6.5v7" stroke="#6b3a12" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </g>
</svg>
