<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Settings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5f7f93"/>
      <stop offset="1" stop-color="#2a3d4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="14%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe7ec"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e5a6b"/>
      <stop offset="1" stop-color="#22323e"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#0f1a22" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>

  <g filter="url(#drop)" fill="url(#gear)">
    <g id="tooth">
      <rect x="44" y="17" width="12" height="18" rx="3"/>
    </g>
    <use href="#tooth" transform="rotate(45 50 50)"/>
    <use href="#tooth" transform="rotate(90 50 50)"/>
    <use href="#tooth" transform="rotate(135 50 50)"/>
    <use href="#tooth" transform="rotate(180 50 50)"/>
    <use href="#tooth" transform="rotate(225 50 50)"/>
    <use href="#tooth" transform="rotate(270 50 50)"/>
    <use href="#tooth" transform="rotate(315 50 50)"/>
    <circle cx="50" cy="50" r="25"/>
  </g>

  <circle cx="50" cy="50" r="16" fill="none" stroke="#c9d6de" stroke-width="2"/>
  <circle cx="50" cy="50" r="9" fill="url(#hub)"/>
</svg>
