<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Mail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#3e6aa8"/>
      <stop offset="1" stop-color="#1d3360"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="14%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#efe7dd"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ef"/>
      <stop offset="1" stop-color="#e6dccf"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b38a"/>
      <stop offset="1" stop-color="#c8553d"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#0c1730" flood-opacity="0.55"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0c1730" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <!-- The envelope's back, open, with a letter rising out of it. -->
    <path d="M20 44 50 24 80 44V76H20Z" fill="url(#flap)"/>
    <g filter="url(#lift)">
      <rect x="28" y="30" width="44" height="36" rx="2.5" fill="url(#paper)"/>
      <path d="M34 38h24M34 44h32M34 50h20" stroke="#d9cbbb" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- The pocket in front, folding in from both sides to the middle. -->
    <path d="M20 46 50 64 80 46V73.5Q80 76 77.5 76H22.5Q20 76 20 73.5Z" fill="url(#pocket)"/>
    <path d="M20 76 44 58M80 76 56 58" stroke="#d9cbbb" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
