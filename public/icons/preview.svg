<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4f6f9a"/>
      <stop offset="1" stop-color="#1f3354"/>
    </linearGradient>
    <radialGradient id="glow" cx="28%" cy="14%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ec"/>
      <stop offset="1" stop-color="#ecdcc6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3c79a"/>
      <stop offset="1" stop-color="#d79a5e"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#0f1a2b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#glow)"/>

  <g filter="url(#drop)">
    <!-- A picture in its frame: a warm sky, a sun, and hills. -->
    <rect x="18" y="24" width="64" height="52" rx="8" fill="url(#frame)"/>
    <rect x="24" y="30" width="52" height="40" rx="4" fill="url(#sky)"/>
    <circle cx="62" cy="41" r="5" fill="#fff7ec"/>
    <path d="M24 70V60l12-11 10 9 9-7 21 15v4z" fill="#24493f"/>
    <!-- And a magnifier over its corner, for seeing it larger. -->
    <circle cx="70" cy="68" r="10" fill="none" stroke="#fff7ec" stroke-width="4.5"/>
    <path d="M77 75l8 8" stroke="#fff7ec" stroke-width="5.5" stroke-linecap="round"/>
  </g>
</svg>
